<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 130" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Caveat:wght@700&amp;display=swap');

      .manga-bubble {
        fill: #ffffff;
        stroke: #000000;
        stroke-width: 4.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .manga-hatch {
        stroke: #000000;
        stroke-width: 1.6;
        stroke-linecap: round;
      }

      /* Hand-drawn style matching Swyx banner */
      .manga-text {
        font-family: 'Caveat', 'Architects Daughter', cursive, sans-serif;
        font-size: 52px;
        font-weight: 700;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <g id="speech-bubble">
    <!-- Organic Manga Speech Balloon with Shorter, Softened Left Tail -->
    <path class="manga-bubble" d="
      M 115,48
      C 115,22 220,10 470,10
      C 720,10 825,22 825,65
      C 825,108 720,120 470,120
      C 280,120 165,112 125,90
      C 100,83 68,74 38,66
      C 64,60 92,56 115,48 Z" />

    <!-- 2 Short, Subtle Upper-Right Manga Accent Lines -->
    <line x1="775" y1="32" x2="795" y2="26" class="manga-hatch" />
    <line x1="783" y1="40" x2="803" y2="34" class="manga-hatch" />
  </g>

  <!-- Text: Title Case Hand-Written Style -->
  <text x="495" y="63" class="manga-text">Namaste, I am Aaryan!</text>
</svg>


