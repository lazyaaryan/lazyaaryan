<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 840 130"
     width="100%"
     height="100%">

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;display=swap');

      .bubble {
        fill: #fff;
        stroke: #000;
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .text {
        font-family: 'Patrick Hand', cursive;
        font-size: 52px;
        font-weight: 400;
        fill: #000;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .accent {
        stroke: #000;
        stroke-width: 2;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Hand-drawn speech bubble -->
  <path class="bubble"
    d="
      M 112 48
      C 112 22, 215 10, 470 10
      C 720 10, 828 22, 828 65
      C 828 108, 720 120, 470 120
      C 215 120, 112 108, 112 65
      C 112 58, 112 53, 112 48
      Z
    "
  />

  <!-- Small manga accent marks -->
  <line class="accent"
        x1="775" y1="32"
        x2="796" y2="26" />

  <line class="accent"
        x1="784" y1="41"
        x2="805" y2="35" />

  <!-- Handwritten dialogue -->
  <text class="text"
        x="470"
        y="66">
    NAMASTE, I AM AARYAN!
  </text>

</svg>


